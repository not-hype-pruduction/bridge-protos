syntax = "proto3";

package biding.v1;

option go_package = "biding.v1;bidingv1";

service BidingService {
  rpc MakeBid(MakeBidRequest) returns (MakeBidResponse);
}

message Call {
  SpecialCall type = 1;
  int32 level = 2;
  Suit suit = 3;
}

message Hand {
  string pbn = 1;
}

message MakeBidRequest {
  Hand player_hand = 1;
  repeated Call auction_history = 2;
  Vulnerability vulnerability = 3;
  Seat dealer = 4;
  System system_name = 5;
}

message MakeBidResponse {
  Call next_call = 1;
}

enum Suit {
  SUIT_UNSPECIFIED = 0;
  SUIT_CLUBS = 1;
  SUIT_DIAMONDS = 2;
  SUIT_HEARTS = 3;
  SUIT_SPADES = 4;
  SUIT_NO_TRUMP = 5;
}

enum SpecialCall {
  SPECIAL_CALL_UNSPECIFIED = 0;
  SPECIAL_CALL_PASS = 1;
  SPECIAL_CALL_DOUBLE = 2;
  SPECIAL_CALL_REDOUBLE = 3;
  SPECIAL_CALL_BID = 4;
}

enum Seat {
  SEAT_UNSPECIFIED = 0;
  SEAT_NORTH = 1;
  SEAT_EAST = 2;
  SEAT_SOUTH = 3;
  SEAT_WEST = 4;
}

enum Vulnerability {
  VULNERABILITY_UNSPECIFIED = 0;
  VULNERABILITY_NONE = 1;
  VULNERABILITY_NS_VUL = 2;
  VULNERABILITY_EW_VUL = 3;
  VULNERABILITY_BOTH_VUL = 4;
}

enum System {
  SYSTEM_UNSPECIFIED = 0;
  SYSTEM_SPUTNIK = 1;
}
