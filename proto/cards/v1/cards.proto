syntax = "proto3";

package cards.v1;

option go_package = "cards.v1;cardsv1";

service CardGeneratorService {
  rpc GenerateHands(GenerateHandsRequest) returns (GenerateHandsResponse);
}

message GenerateHandsRequest {
  int32 my_points_min = 1;
  int32 my_points_max = 2;

  int32 partner_points_min = 3;
  int32 partner_points_max = 4;

  string delaer = 5;

  User north = 6;
  User south = 7;
  User west = 8;
  User east = 9;
}

enum User {
  USER_OWNER_UNSPECIFIED = 0;
  USER_PARTNER = 1;
  USER_PLAYER1 = 2;
  USER_PLAYER2 = 3;
}

message GenerateHandsResponse {
  string pbn = 1;
}
